# Perfil de producción (Azure App Service). Se activa con SPRING_PROFILES_ACTIVE=prod.
# No contiene secretos: los valores llegan como variables de entorno
# (Azure: Configuración > Variables de entorno > Configuración de la aplicación).
spring.application.name=back
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota

# Swagger y /v3/api-docs desactivados en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Secreto en Base64 de al menos 256 bits
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Solo se usa si la tabla usuario está vacía al arrancar
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Solo el cliente web puede usar la API: CORS en el navegador y filtro de origen en el servidor
app.cors.allowed-origins=https://horarios.sergio.games
app.security.require-origin=true
